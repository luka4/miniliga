# Scrapes autrin.sk (official Miniliga site) and fills only the missing / placeholder matches of the JESEŇ 2026
# block in docs/data/matches.json (existing rows are never modified),
# then commits and pushes to main. Script: scripts/autrin/crawl.mjs. Name mapping: scripts/autrin/name-map.json
# (player names come from the DB_<SEASON> roster tab, falling back to names already in matches.json).
# The crawler writes nothing when a safety check fails, so a failed run keeps the last good data.
# Trigger: manual only (Actions -> "Autrin data" -> Run workflow).
# New real results also trigger a OneSignal push (scripts/autrin/notify.mjs; secrets ONESIGNAL_APP_ID, ONESIGNAL_API_KEY).

name: Autrin data
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autrin-data
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape autrin.sk and publish matches.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Scrape
        run: node scripts/autrin/crawl.mjs --out docs/data/matches.json --notify-out "$RUNNER_TEMP/played.json"

      - name: Commit and push
        id: push
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/data/matches.json; then
            echo "No data changes."
            exit 0
          fi
          # CLAUDE.md convention: bump the cache-buster for matches.json
          node -e "
            const fs = require('fs'), f = 'docs/matchData.js';
            const s = fs.readFileSync(f, 'utf8');
            const t = s.replace(/(ASSET_VERSION = ')(\d+)(')/, (_, a, n, c) => a + (Number(n) + 1) + c);
            if (t === s) throw new Error('ASSET_VERSION not found');
            fs.writeFileSync(f, t);
          "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Timestamp for the "Aktualizované" badge (shown in Bratislava time by script.js;
          # the Config!B2 value from the sheet takes priority over it)
          echo "{\"updated\": \"$(date -u +%FT%TZ)\"}" > docs/data/updated.json
          git add docs/data/matches.json docs/matchData.js docs/data/updated.json
          git commit -m "Autrin data $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Push notification (OneSignal) for team matches that just got real results; only after the data is live.
      # Needs repository secrets ONESIGNAL_APP_ID and ONESIGNAL_API_KEY.
      - name: Notify subscribers
        if: steps.push.outputs.pushed == 'true'
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: node scripts/autrin/notify.mjs "$RUNNER_TEMP/played.json"
